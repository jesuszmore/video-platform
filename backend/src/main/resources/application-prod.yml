spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER}

app:
  aws:
    region: ${AWS_REGION}
    endpoint: ""
  s3:
    raw-bucket: ${RAW_BUCKET}
    processed-bucket: ${PROCESSED_BUCKET}
  sqs:
    transcode-queue-url: ${TRANSCODE_QUEUE_URL}
