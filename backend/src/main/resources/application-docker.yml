spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/videos}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  aws:
    region: us-east-1
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  s3:
    raw-bucket: ${RAW_BUCKET:video-raw}
    processed-bucket: ${PROCESSED_BUCKET:video-processed}
  sqs:
    transcode-queue-url: ${TRANSCODE_QUEUE_URL:http://localhost:4566/000000000000/transcode-queue}
