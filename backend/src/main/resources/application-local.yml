spring:
  datasource:
    url: jdbc:h2:mem:videos;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: validate

app:
  aws:
    region: us-east-1
    endpoint: ${AWS_ENDPOINT:http://localhost:4566}
  s3:
    raw-bucket: ${RAW_BUCKET:video-raw}
    processed-bucket: ${PROCESSED_BUCKET:video-processed}
  sqs:
    transcode-queue-url: ${TRANSCODE_QUEUE_URL:http://localhost:4566/000000000000/transcode-queue}
