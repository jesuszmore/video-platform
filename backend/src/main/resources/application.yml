server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: video-platform-api
  profiles:
    default: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/videos}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      idle-timeout: 60000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  aws:
    region: ${AWS_REGION:eu-west-1}
    endpoint: ${AWS_ENDPOINT:}
    presign-endpoint: ${AWS_PRESIGN_ENDPOINT:}
  s3:
    raw-bucket: ${RAW_BUCKET:video-raw}
    processed-bucket: ${PROCESSED_BUCKET:video-processed}
  sqs:
    transcode-queue-url: ${TRANSCODE_QUEUE_URL:}
  presign:
    part-ttl: ${PRESIGN_PART_TTL:PT15M}
    max-urls-per-request: ${PRESIGN_MAX_URLS:1000}
  upload:
    min-part-size: ${UPLOAD_MIN_PART_SIZE:5242880}
    default-part-size: ${UPLOAD_DEFAULT_PART_SIZE:8388608}
    max-parts: ${UPLOAD_MAX_PARTS:10000}
